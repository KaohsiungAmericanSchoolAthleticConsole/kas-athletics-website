# Publishes the website to GitHub Pages every time main is pushed, including
# when staff press "Publish changes" in /admin (that commits data/content.json).
# Tests run first, so content that fails validation never goes live.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Export the site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          PAGES_REPO: ${{ github.repository }}
          PAGES_BRANCH: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
